info:
  title: Home Library Service API
  description: API documentation for the music library project
  version: '1.0'
  contact: {}
tags:
  - name: artists
    description: ''
  - name: albums
    description: ''
  - name: tracks
    description: ''
  - name: favorites
    description: ''
  - name: app
    description: ''
servers: []
components:
  schemas:
    CreateArtistDto:
      type: object
      properties:
        name:
          type: string
          description: The name of the artist
          example: Freddie Mercury
        grammy:
          type: boolean
          description: Whether the artist has won a Grammy award
          example: true
      required:
        - name
        - grammy
    Artist:
      type: object
      properties:
        id:
          type: string
          description: The id  of the artist
          example: 4de888bd-af6a-497e-aace-f90641e9d33c
        name:
          type: string
          description: The name of the artist
          example: Freddie Mercury
        grammy:
          type: boolean
          description: Whether the artist has won a Grammy award
          example: true
      required:
        - id
        - name
        - grammy
    UpdateArtistDto:
      type: object
      properties:
        name:
          type: string
          description: The name of the artist
          example: Freddie Mercury
        grammy:
          type: boolean
          description: Whether the artist has won a Grammy award
          example: true
    CreateAlbumDto:
      type: object
      properties:
        name:
          type: string
          description: The name of the album
          example: Mutter
        year:
          type: number
          description: The release year of the album
          example: 2001
        artistId:
          type: string
          description: >-
            The UUID of the artist who created the album, or null if the artist
            does not exist.
          nullable: true
          example: &ref_6
            - 7f69ce5a-6eee-4fc4-a800-0372b05d9987
            - null
      required:
        - name
        - year
        - artistId
    Album:
      type: object
      properties:
        id:
          type: string
          description: The id  of the album
          example: 4de888bd-af6a-497e-aace-f90641e9d33c
        name:
          type: string
          description: The name of the album
          example: Mutter
        year:
          type: number
          description: The release year of the album
          example: 2001
        artistId:
          type: string
          description: >-
            The UUID of the artist who created the album, or null if the artist
            does not exist.
          nullable: true
          example:
            - 7f69ce5a-6eee-4fc4-a800-0372b05d9987
            - null
      required:
        - id
        - name
        - year
        - artistId
    UpdateAlbumDto:
      type: object
      properties:
        name:
          type: string
          description: The name of the album
          example: Mutter
        year:
          type: number
          description: The release year of the album
          example: 2001
        artistId:
          type: string
          description: >-
            The UUID of the artist who created the album, or null if the artist
            does not exist.
          nullable: true
          example: *ref_6
    CreateTrackDto:
      type: object
      properties:
        name:
          type: string
          description: The name of the track
          example: Nebel
        artistId:
          type: string
          description: >-
            The UUID of the artist who created the album, or null if the artist
            does not exist.
          nullable: true
          example: &ref_7
            - 7f69ce5a-6eee-4fc4-a800-0372b05d9987
            - null
        albumId:
          type: string
          description: >-
            The UUID of the album where the track belongs, or null if the album
            does not exist.
          nullable: true
          example: &ref_8
            - 7f69ce5a-6eee-4fc4-a800-0372b05d9987
            - null
        duration:
          type: number
          description: The duration of the track in sec
          example: 188
      required:
        - name
        - artistId
        - albumId
        - duration
    Track:
      type: object
      properties:
        id:
          type: string
          description: The id  of the track
          example: 4de888bd-af6a-497e-aace-f90641e9d33c
        name:
          type: string
          description: The name of the track
          example: Nebel
        artistId:
          type: string
          description: >-
            The UUID of the artist who created the album, or null if the artist
            does not exist.
          nullable: true
          example:
            - 7f69ce5a-6eee-4fc4-a800-0372b05d9987
            - null
        albumId:
          type: string
          description: >-
            The UUID of the album where the track belongs, or null if the album
            does not exist.
          nullable: true
          example:
            - 7f69ce5a-6eee-4fc4-a800-0372b05d9987
            - null
        duration:
          type: number
          description: The duration of the track in sec
          example: 188
      required:
        - id
        - name
        - artistId
        - albumId
        - duration
    UpdateTrackDto:
      type: object
      properties:
        name:
          type: string
          description: The name of the track
          example: Nebel
        artistId:
          type: string
          description: >-
            The UUID of the artist who created the album, or null if the artist
            does not exist.
          nullable: true
          example: *ref_7
        albumId:
          type: string
          description: >-
            The UUID of the album where the track belongs, or null if the album
            does not exist.
          nullable: true
          example: *ref_8
        duration:
          type: number
          description: The duration of the track in sec
          example: 188
    FavoritesResponseDto:
      type: object
      properties:
        artists:
          type: array
          items:
            $ref: '#/components/schemas/Artist'
        albums:
          type: array
          items:
            $ref: '#/components/schemas/Album'
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/Track'
      required:
        - artists
        - albums
        - tracks
    CreateUserDto:
      type: object
      properties:
        login:
          type: string
          description: The user login/username
          example: newUserLogin
        password:
          type: string
          description: 'The user password '
          example: P@ssw0rd123!
      required:
        - login
        - password
    SafeUserEntity:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for the user (UUID)
          example: a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11
          format: uuid
        login:
          type: string
          description: The user login/username
          example: johndoe123
        version:
          type: number
          description: Version of the user (incremented on each update)
          example: 1
        createdAt:
          type: number
          description: Timestamp of user creation (Unix epoch in milliseconds)
          example: 1678886400000
        updatedAt:
          type: number
          description: Timestamp of last user update (Unix epoch in milliseconds)
          example: 1678890000000
      required:
        - id
        - login
        - version
        - createdAt
        - updatedAt
    UpdatePasswordDto:
      type: object
      properties:
        oldPassword:
          type: string
          description: The user's current/old password
          example: CurrentP@ss123
        newPassword:
          type: string
          description: The user's new password
          example: NewAndBetterP@ss123
      required:
        - oldPassword
        - newPassword
    SignUpDto:
      type: object
      properties:
        login:
          type: string
          description: The user login/username
          example: newUserLogin
        password:
          type: string
          description: 'The user password '
          example: P@ssw0rd123!
      required:
        - login
        - password
    LoginDto:
      type: object
      properties:
        login:
          type: string
          description: The user login/username
          example: newUserLogin
        password:
          type: string
          description: 'The user password '
          example: P@ssw0rd123!
      required:
        - login
        - password
    RefreshTokenDto:
      type: object
      properties: {}
